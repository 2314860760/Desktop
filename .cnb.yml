$:
  vscode:
    - docker:
        build:
          dockerfile: .docker/.dockerfile
      runner:
        cpus: 32
      services:
        - vscode
        - docker
      env:
        NVIDIA_VISIBLE_DEVICES: all
        NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,video
      stages:
        - name: 初始化环境
          script: chmod +x /workspace/Installer/Installer.sh && bash /workspace/Installer/Installer.sh
        - name: vscode go
          type: vscode:go
        - name: ls
          script: ls -al


KDE:
  vscode:
    - docker:
        build:
          dockerfile: .docker/.dockerfile
      runner:
        cpus: 16
      services:
        - vscode
        - docker
      stages:
        - name: 初始化环境
          script: chmod +x /workspace/Installer/Installer.sh && bash /workspace/Installer/Installer.sh
        - name: vscode go
          type: vscode:go
          
LXQT:
  vscode:
    - docker:
        build:
          dockerfile: .docker/.dockerfile
      runner:
        cpus: 16
      services:
        - vscode
        - docker
      stages:
        - name: 设置桌面
          script: sed -i 's|startplasma-x11|startlxqt|' /root/.vnc/xstartup /home/user/.vnc/xstartup
        - name: 初始化环境
          script: chmod +x /workspace/Installer/Installer.sh && bash /workspace/Installer/Installer.sh
        - name: vscode go
          type: vscode:go


