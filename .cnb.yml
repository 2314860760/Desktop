.onlyPreview: &onlyPreview
  name: vscode
  options:
    onlyPreview: true
    launch: |
      chmod +x /workspace/Installer/Installer.sh && bash /workspace/Installer/Installer.sh
      chmod +x /workspace/Installer/Preview.sh && bash /workspace/Installer/Preview.sh
    keepAliveTimeout: 10m
    daemon: false

$:
  vscode:
    - docker:
        image: docker.cnb.cool/set/playground/desktop:main20261030
      runner:
        cpus: 32
      services:
        - *onlyPreview
        - docker
      stages:
        - echo "你好，世界！"

GPU:
  vscode:
    - docker:
        image: docker.cnb.cool/set/playground/desktop:GPU
      runner:
        tags: cnb:arch:amd64:gpu
      services:
        - *onlyPreview
        - docker
      env:
        NVIDIA_VISIBLE_DEVICES: all
        NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,video
      stages:
        - echo "你好，世界！"
